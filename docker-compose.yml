services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_USER: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    image: odoo:17
    depends_on:
      db:
        condition: service_healthy
    # Initialise a TEST database with selected modules and demo data so the
    # default super-user admin / admin is ready to log in.
    command: odoo -d odoo -i base,contacts,sale,purchase --without-demo=0
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24

volumes:
  db-data:
  odoo-data: